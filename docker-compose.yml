services:

  # --------------------------------------------------------------------------------------
  # Setup
  db:
    image: postgres:16
    container_name: ${DB_HOST}
    restart: on-failure:3
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------------------
  # PgAdmin

  pgadmin:
    image: dpage/pgadmin4
    container_name: ${PGADMIN_CONTAINER_NAME}
    restart: on-failure:3
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - ${PGADMIN_PORTS}
    depends_on:
      db:
        condition: service_healthy

  # --------------------------------------------------------------------------------------
  # REST API Setup
  api:
    init: true
    image: guacamoleboy/moodmap-api:latest
    container_name: ${DB_CONTAINER_NAME}
    restart: on-failure:3
    stop_grace_period: 30s
    pull_policy: always
    mem_limit: 384m
    memswap_limit: 512m
    cpus: 0.80
    ports:
      - ${DB_PORTS}
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx256m
      - APP_VERSION=${APP_VERSION}
      - APP_ENV=${APP_ENV}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - SERVER_PORT=${SERVER_PORT}
      - API_BASE_PATH=${API_BASE_PATH}
      - URL_PATHING=${URL_PATHING}
      - ROUTE_ENDPOINT_FOLDER=${ROUTE_ENDPOINT_FOLDER}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7070/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

    # --------------------------------------------------------------------------------------
    # Watchtower

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: on-failure:3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=3600
    command: ${DB_CONTAINER_NAME}
    depends_on:
      - api

# ________________________________________________________________________________________

volumes:
  postgres_data: